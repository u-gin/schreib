name: Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          cache: true
      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - run: flutter build web --release --base-href "/"

      # GitHub Pages serves static files only, so a request for /submit has no
      # file to match and 404s. Serving index.html as the 404 page hands the
      # route back to the router.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: schreibapp.com
